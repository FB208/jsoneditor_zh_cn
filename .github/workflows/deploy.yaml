name: Build and Deploy on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r examples deploy/
          cp -r docs deploy/
          # 创建首页 index.html
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <title>JSONEditor 中文版</title>
            <link href="dist/jsoneditor.min.css" rel="stylesheet">
            <script src="dist/jsoneditor.min.js"></script>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { 
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                padding: 20px;
              }
              .container { max-width: 1200px; margin: 0 auto; }
              h1 { 
                color: #fff; 
                text-align: center; 
                margin-bottom: 20px;
                font-size: 2rem;
              }
              #jsoneditor { 
                width: 100%; 
                height: calc(100vh - 180px);
                border-radius: 8px;
                overflow: hidden;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🔧 JSONEditor 中文版</h1>
              <div id="jsoneditor"></div>
            </div>
            <script>
              const container = document.getElementById('jsoneditor');
              const editor = new JSONEditor(container, {
                mode: 'code',
                modes: ['code', 'tree', 'view', 'form', 'text', 'preview']
              });
              editor.set({
                "欢迎": "JSONEditor 中文版",
                "功能": ["查看", "编辑", "格式化", "验证"],
                "示例": { "字符串": "你好", "数字": 123, "布尔": true, "空值": null }
              });
              document.getElementById('formatBtn').onclick = () => {
                try { editor.set(editor.get()); } catch(e) { alert('JSON格式错误'); }
              };
              document.getElementById('compactBtn').onclick = () => {
                try { 
                  const text = JSON.stringify(editor.get());
                  editor.setText(text);
                } catch(e) { alert('JSON格式错误'); }
              };
              document.getElementById('clearBtn').onclick = () => editor.set({});
              document.getElementById('copyBtn').onclick = () => {
                try {
                  navigator.clipboard.writeText(JSON.stringify(editor.get(), null, 2));
                  alert('已复制到剪贴板');
                } catch(e) { alert('复制失败'); }
              };
            </script>
          </body>
          </html>
          EOF

      - name: Archive build artifact
        run: |
          tar -czf dist.tgz -C deploy .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: dist.tgz

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: static-dist

      - name: Upload via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "dist.tgz"
          target: "/tmp"

      - name: Remote deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            TMP_DIR=/tmp
            DEST_DIR=${{ secrets.NGINX_HTML_DIR }}
            mkdir -p "$TMP_DIR/deploy_dist"
            tar -xzf "$TMP_DIR/dist.tgz" -C "$TMP_DIR/deploy_dist"
            # 备份当前站点
            if [ -d "$DEST_DIR" ]; then
              ts=$(date +%Y%m%d%H%M%S)
              mv "$DEST_DIR" "${DEST_DIR}-${ts}-bak" || true
            fi
            mkdir -p "$DEST_DIR"
            rsync -a --delete "$TMP_DIR/deploy_dist/" "$DEST_DIR/"
            # 基础权限与所有权（如需）
            if command -v restorecon >/dev/null 2>&1; then restorecon -R "$DEST_DIR"; fi

  notify:
    name: Send email notification
    needs:
      - build-and-push
      - deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "[jsoneditor] Tag ${{ github.ref_name }} 部署结果: build=${{ needs.build-and-push.result }}, deploy=${{ needs.deploy.result }}"
          to: ${{ secrets.GMAIL_TO }}
          from: ${{ secrets.GMAIL_USERNAME }}
          secure: false
          body: |
            仓库: ${{ github.repository }}
            触发: push tag ${{ github.ref_name }}
            构建: ${{ needs.build-and-push.result }}
            部署: ${{ needs.deploy.result }}
            提交: ${{ github.sha }}
            运行链接: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            触发人: ${{ github.actor }}

